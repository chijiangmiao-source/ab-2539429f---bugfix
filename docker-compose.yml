# Tensor-network contraction planner — full stack.
#
# Configurable host ports (override via a .env file or shell environment):
#   API_HOST_PORT  - host port mapped to the FastAPI service (default 8000)
#   WEB_HOST_PORT  - host port mapped to the web UI / nginx   (default 8080)
#
#   docker compose up --build          # start API + web
#   docker compose run --rm verify     # one-shot tests + build + API smoke
#
services:
  api:
    build:
      context: ./backend
      target: runtime
    image: tn-planner-api:latest
    environment:
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3); assert json.load(r)['status']=='ok'"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  web:
    build:
      context: ./web
    image: tn-planner-web:latest
    environment:
      # internal reverse-proxy target (service name + container port)
      API_UPSTREAM: "api:8000"
    ports:
      - "${WEB_HOST_PORT:-8080}:80"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # One-shot verification: backend pytest, web production build and a live
  # API smoke test (four-tensor co-optimal classification, the unique
  # mandatory-cut case and the triple-index error boundary). Exits 0 on
  # success and a non-zero code on any failure.
  # Kept under its own profile so `docker compose up` runs only api + web;
  # launch explicitly with `docker compose run --rm verify`.
  verify:
    profiles: ["verify"]
    build:
      context: .
      dockerfile: deploy/Dockerfile.verify
    image: tn-planner-verify:latest
    environment:
      API_BASE_URL: "http://api:8000"
    depends_on:
      api:
        condition: service_healthy
    restart: "no"
